[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; 4 MB Flash partition layout with OTA support (~1.9 MB per app slot instead of 1.25 MB default)
board_build.partitions = min_spiffs.csv

; === Wi-Fi OTA upload (no need to open the case or hold the BOOT button) ===
; Flash once over USB to install the partition table & OTA receiver,
; then set upload_port to the IP address shown on the cube's display.
upload_protocol = espota
upload_port = 192.168.0.100

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=-1
    -DTFT_DC=16
    -DTFT_RST=4
    -DTFT_SPI_MODE=SPI_MODE3
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=10000000
