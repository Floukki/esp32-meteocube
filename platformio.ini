[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Разметка памяти для 4 МБ Flash с поддержкой OTA (по 1.9 МБ на прошивку вместо 1.25 МБ)
board_build.partitions = min_spiffs.csv

; === Для прошивки по Wi-Fi (OTA) без кнопки BOOT ===
; После того как 1 раз прошьёте по кабелю, раскомментируйте 2 строки ниже
; и укажите IP-адрес, который написан на экране кубика:
upload_protocol = espota
upload_port = 192.168.0.100

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=-1
    -DTFT_DC=16
    -DTFT_RST=4
    -DTFT_SPI_MODE=SPI_MODE3
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=10000000
